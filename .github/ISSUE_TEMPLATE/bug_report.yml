name: 🐛 Bug Report
description: Create a report to help us improve Akcelerátor altruismu
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '/near'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device / Environment
      description: What device or browser were you using?
      options:
        - Mobile (iOS Safari)
        - Mobile (Android Chrome)
        - Desktop (Chrome / Chromium)
        - Desktop (Firefox)
        - Desktop (Safari)
        - Other (specify below)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context & Screenshots
      description: Add any other context, console errors, or screenshots about the problem here.
