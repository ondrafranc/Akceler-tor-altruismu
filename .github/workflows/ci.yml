name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: akcelerator-landing-page/package-lock.json

      - name: Install dependencies
        working-directory: akcelerator-landing-page
        run: npm ci

      - name: Type check (svelte-check)
        working-directory: akcelerator-landing-page
        run: npm run check

      - name: Unit tests (vitest)
        working-directory: akcelerator-landing-page
        run: npm run test:unit

      - name: Production build
        working-directory: akcelerator-landing-page
        run: npm run build
