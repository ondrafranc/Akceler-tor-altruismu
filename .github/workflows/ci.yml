name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: akcelerator-landing-page/package-lock.json

      - name: Install dependencies
        working-directory: akcelerator-landing-page
        run: npm ci

      - name: Type check (svelte-check)
        working-directory: akcelerator-landing-page
        run: npm run check

      - name: Unit tests (vitest)
        working-directory: akcelerator-landing-page
        run: npm run test:unit

      - name: Production build
        working-directory: akcelerator-landing-page
        run: npm run build

  # Runs alongside `validate`: Playwright builds the app itself, so neither job waits for the other.
  e2e-smoke:
    # Pinned: the pinned Playwright version has no browser build for newer Ubuntu images.
    # Move back to ubuntu-latest when @playwright/test is upgraded.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: akcelerator-landing-page
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: akcelerator-landing-page/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('akcelerator-landing-page/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # No Supabase secrets in CI. tests/api.spec.ts needs a live database
      # (it expects 200 from write endpoints), so it runs locally via /ship only.
      - name: Security E2E (playwright)
        run: npm test -- tests/security.spec.ts

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: akcelerator-landing-page/test-results
          retention-days: 7
